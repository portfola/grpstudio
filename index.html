<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Apply the saved theme before first paint to avoid a flash (FOUC).
         No stored choice => no attribute => CSS prefers-color-scheme decides. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('grp-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- title + description + OG are injected per route via <Head> (vite-react-ssg).
         Kept out of this template to avoid duplicate tags in the prerendered HTML. -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
